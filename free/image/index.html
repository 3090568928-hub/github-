<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片文字识别 · github中英实时翻译</title>
  <link rel="stylesheet" href="image.css">
  <script defer src="vendor/tesseract.min.js"></script>
  <script defer src="../common.js"></script>
  <script defer src="image.js"></script>
</head><body><main>
  <h1>图片文字识别</h1>
  <p>选择图片，在本机识别简体中文和英文。点击「翻译文字」时，仅将文字发送给翻译服务。</p>
  <label for="file">图片文件</label>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif">
  <p id="status" role="status" aria-live="polite"></p>
  <label for="source">识别文字</label>
  <textarea id="source" rows="8" placeholder="识别完成后可在这里校对文字"></textarea>
  <div class="actions"><label for="target">译为</label><select id="target">
    <option value="zh-CN">简体中文</option><option value="en">英语</option>
  </select><button id="translate" type="button" disabled>翻译文字</button></div>
  <label for="result">译文</label>
  <textarea id="result" rows="8" readonly></textarea>
</main></body></html>
