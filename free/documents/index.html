<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文档翻译 · github中英实时翻译</title>
  <link rel="stylesheet" href="documents.css">
</head>
<body>
<main>
  <h1>文档翻译</h1>
  <p>文件在本机解析。点「开始翻译」后，待译文字将发送给扩展使用的免费翻译服务。</p>
  <form>
    <label for="file">选择本地文件</label>
    <input id="file" type="file" required accept=".txt,.md,.markdown,.json,.html,.htm,.xhtml,.mhtml,.mht,.srt,.vtt,.ass,.ssa,.lrc,.docx,.epub,.pdf">
    <p class="hint">支持普通文本、Markdown、JSON、网页、字幕、DOCX、EPUB 和含可选文字的 PDF。PDF 和网页导出为双语 HTML，JSON 保留键名并翻译字符串值。</p>
    <section class="controls">
      <label for="target">译为</label>
      <select id="target"><option value="zh-CN">简体中文</option><option value="en">英语</option></select>
      <button id="start" type="submit">开始翻译</button>
      <button id="cancel" type="button" hidden>取消</button>
    </section>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <a id="download" hidden>下载译文</a>
  <section id="preview" hidden><h2>译文预览</h2><div id="rows"></div></section>
</main>
<script src="../vendor/jszip.min.js"></script>
<script type="module" src="documents.js"></script>
</body>
</html>
